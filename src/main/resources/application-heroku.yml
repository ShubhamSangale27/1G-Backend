# Heroku profile: use PORT and DATABASE_URL (handled by HerokuDataSourceConfig)
spring:
  config:
    activate:
      on-profile: heroku
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: com.fasterxml.jackson.databind.util.StdDateFormat
    time-zone: UTC
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

# CORS / frontend URL — set FRONTEND_URL on Heroku to override default
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-ttl-ms: ${JWT_ACCESS_TTL:3600000}
    refresh-ttl-ms: ${JWT_REFRESH_TTL:604800000}
  otp:
    expiry-minutes: 10
    length: 6
    log-otp: true   # print OTP in Heroku logs during signup (Postgres profile)
  msg91:
    authkey: ${MSG91_AUTHKEY:}
    sender: ${MSG91_SENDER:}
    templateId: ${MSG91_TEMPLATE_ID:}
  stripe:
    api-key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  frontend-url: ${FRONTEND_URL:https://og-frontend-dcde6e23b119.herokuapp.com}
  google-maps-api-key: ${GOOGLE_MAPS_API_KEY:}
  google-drive:
    folder-id: ${GOOGLE_DRIVE_FOLDER_ID:1wYcQ625QmwveUa1h4VoQQFZkLitAc0bx}
    credentials-path: ${GOOGLE_DRIVE_CREDENTIALS_PATH:}
    credentials-json: ${GOOGLE_DRIVE_CREDENTIALS_JSON:}
    credentials-base64: ${GOOGLE_DRIVE_CREDENTIALS_BASE64:}
  mail-from: ${MAIL_FROM:noreply@realestate.com}
  support:
    email: ${SUPPORT_EMAIL:support@1guntha.com}
    website: ${SUPPORT_WEBSITE:https://1guntha.com}
    phone: ${SUPPORT_PHONE:}

logging:
  level:
    root: INFO
    com.realestate: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
