server:
  servlet:
    context-path: ""

spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:realestate_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025
    username: test
    password: test

app:
  jwt:
    secret: test-secret-key-for-jwt-token-generation-min-256-bits
    access-ttl-ms: 3600000
    refresh-ttl-ms: 604800000
  otp:
    expiry-minutes: 10
    length: 6
  frontend-url: http://localhost:4200
