# =============================================================================
# REAL ESTATE BACKEND - SINGLE CONFIG FILE
# Configure database, SMTP, JWT, OTP (MSG91), Stripe, Google Maps, etc.
# Use environment variables or set values here. See MSG91_CREDENTIALS.md for OTP setup.
# =============================================================================

spring:
  application:
    name: realestate-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: com.fasterxml.jackson.databind.util.StdDateFormat
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# -----------------------------------------------------------------------------
# APP CONFIG - JWT, OTP (MSG91), Stripe, Google Maps, etc.
# Database: spring.datasource (see dev profile). SMTP: spring.mail (see dev profile).
# -----------------------------------------------------------------------------
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-ttl-ms: ${JWT_ACCESS_TTL:3600000}
    refresh-ttl-ms: ${JWT_REFRESH_TTL:604800000}

  # OTP - Length, expiry. SMS is sent via MSG91 (see msg91 section).
  # Set test-otp (e.g. "123456") for local/testing without DLT or MSG91 – remove in production.
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
    length: ${OTP_LENGTH:6}
    test-otp: ${OTP_TEST_OTP:}

  # MSG91 - OTP SMS (India). Add your credentials here or via env vars (see MSG91_CREDENTIALS.md).
  msg91:
    # Your MSG91 auth key (required for sending OTP). Get from MSG91 Dashboard > API Keys.
    authkey: ${MSG91_AUTHKEY:}
    # Sender ID (optional, 6 chars). Default from MSG91 if not set.
    sender: ${MSG91_SENDER:}
    # MSG91 OTP template id (required for send OTP API).
    templateId: ${MSG91_TEMPLATE_ID:}

  # Stripe (payments)
  stripe:
    api-key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

  # Google Maps (optional)
  google-maps-api-key: ${GOOGLE_MAPS_API_KEY:}

  # Frontend URL (CORS, links in emails)
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

  # Upload: Google Drive (preferred) or local directory. See GOOGLE_DRIVE_SETUP.md.
  upload:
    dir: ${UPLOAD_DIR:uploads}
  google-drive:
    folder-id: ${GOOGLE_DRIVE_FOLDER_ID:1wYcQ625QmwveUa1h4VoQQFZkLitAc0bx}
    credentials-path: ${GOOGLE_DRIVE_CREDENTIALS_PATH:}
    credentials-json: ${GOOGLE_DRIVE_CREDENTIALS_JSON:}
    credentials-base64: ${GOOGLE_DRIVE_CREDENTIALS_BASE64:}
  # From address for emails (OTP, etc.)
  mail-from: ${MAIL_FROM:noreply@realestate.com}

logging:
  level:
    root: INFO
    com.realestate: DEBUG
    org.springframework.security: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

---
# DEV PROFILE
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:realestate}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Dev (PostgreSQL): print OTP in console during signup
app:
  otp:
    log-otp: true
